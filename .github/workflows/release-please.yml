name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # GITHUB_TOKENで作成したリリースのpublishedイベントは再帰防止のため
      # 他のワークフローを発火させない。そのためworkflow_dispatchで明示的に
      # release-buildを起動する（dispatchはこの再帰防止の公式な例外）。
      - name: Trigger release-build
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-build.yml \
            --repo "${{ github.repository }}" \
            --ref master \
            -f tag="${{ steps.release.outputs.tag_name }}"
