name: release-build

# release-pleaseがGitHub Releaseを作成したタイミングで、.appバンドルを
# ビルド→Developer ID署名→notarize→staple→zip化してアセット添付する。
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          P12_PATH="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$P12_BASE64" | base64 -d -o "$P12_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$P12_PATH"

      - name: Build unsigned .app
        run: SKIP_ZIP=1 scripts/build-app.sh "${GITHUB_REF_NAME#v}"

      - name: Code sign
        run: |
          FRAMEWORK="dist/RekieSekie.app/Contents/Frameworks/Sparkle.framework/Versions/B"
          # Sparkle.frameworkは内側（XPCServices/Autoupdate/Updater.app）から署名してからフレームワーク本体→appの順で署名する。
          # codesign --deepだけに頼るとApple非推奨（nested codeへのentitlements適用が不確実）なため個別に署名する。
          codesign --force --options runtime --timestamp --sign "Developer ID Application" \
            "${FRAMEWORK}/XPCServices/Downloader.xpc"
          codesign --force --options runtime --timestamp --sign "Developer ID Application" \
            "${FRAMEWORK}/XPCServices/Installer.xpc"
          codesign --force --options runtime --timestamp --sign "Developer ID Application" \
            "${FRAMEWORK}/Autoupdate"
          codesign --force --options runtime --timestamp --sign "Developer ID Application" \
            "${FRAMEWORK}/Updater.app"
          codesign --force --options runtime --timestamp --sign "Developer ID Application" \
            dist/RekieSekie.app/Contents/Frameworks/Sparkle.framework

          codesign --deep --force --options runtime --timestamp \
            --entitlements Packaging/entitlements.plist \
            --sign "Developer ID Application" \
            dist/RekieSekie.app
          codesign --verify --deep --strict --verbose=2 dist/RekieSekie.app

      - name: Notarize
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${AC_API_KEY_ID}.p8"
          printf '%s' "$AC_API_KEY_P8" | base64 -d -o "$KEY_PATH"

          NOTARIZE_ZIP="$RUNNER_TEMP/RekieSekie-notarize.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/RekieSekie.app "$NOTARIZE_ZIP"

          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --key "$KEY_PATH" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait
          rm -f "$KEY_PATH"

      - name: Staple
        run: xcrun stapler staple dist/RekieSekie.app

      - name: Zip stapled app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          rm -f dist/*.zip
          ditto -c -k --sequesterRsrc --keepParent dist/RekieSekie.app "dist/RekieSekie-v${VERSION}.zip"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber

      - name: Update Sparkle appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_VERSION=$(jq -r '.pins[] | select(.identity=="sparkle") | .state.version' Package.resolved)
          gh release download "${SPARKLE_VERSION}" --repo sparkle-project/Sparkle \
            --pattern "Sparkle-${SPARKLE_VERSION}.tar.xz" --dir "$RUNNER_TEMP/sparkle-tools" --clobber
          tar -xf "$RUNNER_TEMP/sparkle-tools/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -C "$RUNNER_TEMP/sparkle-tools" bin/generate_appcast
          chmod +x "$RUNNER_TEMP/sparkle-tools/bin/generate_appcast"

          ARCHIVES_DIR="$RUNNER_TEMP/archives"
          mkdir -p "$ARCHIVES_DIR"
          cp docs/appcast.xml "$ARCHIVES_DIR/appcast.xml"
          cp dist/*.zip "$ARCHIVES_DIR/"

          echo -n "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle-tools/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/" \
            "$ARCHIVES_DIR"

          cp "$ARCHIVES_DIR/appcast.xml" docs/appcast.xml

      - name: Publish appcast to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -B master origin/master
          git add docs/appcast.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Sparkle appcast for ${GITHUB_REF_NAME}"
            git push origin master
          fi

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
